name: Confronto e Coerenza File PO (msgctxt, msgid e formattazione)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-po-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run PO Consistency Check
        run: |
          python .github/check_po_consistency.py
